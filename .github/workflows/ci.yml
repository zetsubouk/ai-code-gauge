name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 语法检查
        run: |
          node --check background/service-worker.js
          node --check popup/popup.js
          for f in shared/*.js scripts/*.mjs tests/*.mjs; do
            node --check "$f"
          done

      # 零构建依赖：无 install 步骤，测试仅用 Node 内置 test runner
      - name: 单元测试
        run: npm test

  # 打 tag（v*）时额外产出商店 zip 供下载
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 打包
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: ai-code-gauge
          path: dist/ai-code-gauge.zip
